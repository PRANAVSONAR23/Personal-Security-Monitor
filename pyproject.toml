[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psm"
version = "0.1.0"
description = "Personal Security Monitor — snapshot-diff forensic inspection for Windows, macOS, and Android."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pranav Sonar" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
psm = "psm.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/psm"]

[tool.hatch.build.targets.sdist]
include = ["src/psm", "shim/", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src/psm/core",
    "src/psm/store",
    "src/psm/normalize",
    "src/psm/collectors/android",
    "src/psm/collectors/macos",
    "src/psm/enrich",
]
